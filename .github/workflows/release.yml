name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (v...)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: stage binary
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/psgen target/release/psgen
      - name: test
        run: sh tests/smoke.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            native: true
            qemu: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            native: true
            qemu: ""
          - runner: ubuntu-24.04
            target: riscv64gc-unknown-linux-musl
            native: false
            qemu: riscv64
          - runner: ubuntu-24.04
            target: i686-unknown-linux-musl
            native: false
            qemu: ""
          - runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            native: false
            qemu: arm
          - runner: ubuntu-24.04
            target: loongarch64-unknown-linux-musl
            native: false
            qemu: loong64
          - runner: ubuntu-24.04
            target: powerpc64le-unknown-linux-musl
            native: false
            qemu: ppc64le
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: build static (zig)
        if: matrix.native == false
        run: |
          set -eu
          ZIG_VERSION=0.16.0
          ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          export PATH="/tmp/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
          zig version
          cargo install --quiet --locked --root /tmp/zigbuild cargo-zigbuild --version 0.23.4
          export PATH="/tmp/zigbuild/bin:$PATH"
          cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: build static (native)
        if: matrix.native == true
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static check
        run: |
          set -eu
          b="target/${{ matrix.target }}/release/psgen"
          command -v readelf >/dev/null || { echo "readelf missing"; exit 1; }
          if readelf -d "$b" | grep -q NEEDED; then
            echo "dynamic dependencies in $b"
            exit 1
          fi
          if readelf -l "$b" | grep -q INTERP; then
            echo "dynamic interpreter in $b"
            exit 1
          fi
          file "$b"
      - name: register qemu
        if: matrix.qemu != ''
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install "${{ matrix.qemu }}"
      - name: version
        run: "target/${{ matrix.target }}/release/psgen --version"
      - name: smoke (cross, under binfmt)
        if: matrix.qemu != ''
        run: |
          set -eu
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/psgen" target/release/psgen
          sh tests/smoke.sh
      - name: package
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          stage="psgen-${version}-${{ matrix.target }}"
          mkdir -p dist "stage/$stage"
          cp "target/${{ matrix.target }}/release/psgen" "dist/psgen-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/psgen" "stage/$stage/psgen"
          cp LICENSE README.md "stage/$stage/"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C stage -cf - "$stage" | gzip -9n > "dist/$stage.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psgen-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: psgen-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum psgen-* > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: publish-crate
        # A large part of the point of the release is that `cargo install
        # psgen` gets the real tool instead of the 0.0.0 reservation. The
        # job only runs for a final tag, and only when the token is present;
        # a fork without the secret skips it rather than failing the release.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping cargo publish"
            exit 0
          fi
          cargo publish --locked
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" $pre --verify-tag --title "psgen $TAG" --notes-file .github/release-notes.md dist/*
